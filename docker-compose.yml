# Chạy cả app (giống môi trường live) bằng 1 lệnh: docker compose up --build
# Mở http://localhost:8080

services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080
      STORAGE_DIR: /data
    volumes:
      - storage:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000 # trình duyệt gọi API qua cổng đã mở ra máy
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  storage:
